import_recipe:
  fields:
    url:
      example: "https://www.ica.se/recept/kanelbullar-712345/"
      selector:
        text:
          type: url
    text:
      selector:
        text:
          multiline: true
    member:
      example: "Alva"
      selector:
        text:
    config_entry_id:
      selector:
        config_entry:
          integration: samsas
notify:
  fields:
    message:
      required: true
      example: "Tvättmaskinen är klar"
      selector:
        text:
    title:
      example: "🧺 Tvätten"
      selector:
        text:
    to:
      example: "Alva"
      selector:
        text:
          multiple: true
    config_entry_id:
      selector:
        config_entry:
          integration: samsas
